name: Verificar STOA
on:
  push:
    branches: [main, nouveau-site]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOA_PUBLICATION: '0'
      RESEND_API_KEY: sentinela-ci-resend-8b2d4e6f
      UPSTASH_REDIS_REST_TOKEN: sentinela-ci-upstash-2e4f6a8c
      UPSTASH_REDIS_REST_URL: https://sentinela-ci-upstash.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm run mensagens
      - run: npm run testes
      - run: npm run build
      - run: npm run segredos
      - name: Rotas e isolamento
        run: |
          npm start > /tmp/stoa-ci.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          for tentativa in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verificar-rotas.mjs
      - name: Build público
        run: npm run build
        env:
          STOA_PUBLICATION: '1'
      - name: Rotas públicas e exclusão de projetos provisórios
        env:
          STOA_PUBLICATION: '1'
        run: |
          npm start -- --port 3201 > /tmp/stoa-publico-ci.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          for tentativa in $(seq 1 60); do
            if curl -sf http://localhost:3201/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verificar-rotas.mjs http://localhost:3201
